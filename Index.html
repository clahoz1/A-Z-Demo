<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>A-Z</title>
<meta name="description" content="A-Z: picture routines, timers, reminders, rewards and calm-down tools for kids and families. Demo with a pretend family.">
<meta name="theme-color" content="#EDF1F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;700;800&family=Lexend:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single-column app shell; sticky top bar, fixed bottom tab bar, content capped at 680px. */
:root {
  --bg: #EDF1F8;
  --surface: #FFFFFF;
  --surface-2: #F5F7FC;
  --ink: #1A2233;
  --muted: #586276;
  --line: #D6DDEA;
  --primary: #2556D0;
  --on-primary: #FFFFFF;
  --star: #E9A300;
  --star-soft: #FFF2CC;
  --good: #1F7F4A;
  --good-soft: #DDF3E6;
  --hard: #B9561A;
  --hard-soft: #FCE7DA;
  --danger: #B92E25;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 6px 18px rgba(20, 30, 60, .07);
  --font-display: "Baloo 2", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
  --kid: #2556D0;
  --kid-soft: #2556D01F;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141D; --surface: #1A2030; --surface-2: #222A3C; --ink: #EDF1F8; --muted: #A4ADC2; --line: #333C52;
    --primary: #7D9DFF; --on-primary: #0E1424; --star: #FFC83D; --star-soft: #3A3115; --good: #5BD08E; --good-soft: #173526;
    --hard: #FF9E66; --hard-soft: #3E2618; --danger: #FF7A70; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141D; --surface: #1A2030; --surface-2: #222A3C; --ink: #EDF1F8; --muted: #A4ADC2; --line: #333C52;
  --primary: #7D9DFF; --on-primary: #0E1424; --star: #FFC83D; --star-soft: #3A3115; --good: #5BD08E; --good-soft: #173526;
  --hard: #FF9E66; --hard-soft: #3E2618; --danger: #FF7A70; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; font-weight: 800; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }

#app { min-height: 100%; }
.page { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 120px; display: grid; gap: 16px; }
.page.no-tabs { padding-bottom: 40px; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top-in { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 10px; min-height: 60px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand .mark { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: .95rem; letter-spacing: 0; }
.top .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; white-space: nowrap; }
.chip.star { background: var(--star-soft); color: var(--ink); }
.chip.btn { min-height: 40px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; }
.who-chip { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who-chip .ava-s { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--kid-soft); font-size: 1.3rem; flex: none; }
.who-chip b { font-family: var(--font-display); font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 14px; font-weight: 700; background: var(--surface); box-shadow: var(--shadow); text-align: center; }
.btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.btn.kid { background: var(--kid); color: #fff; box-shadow: none; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 2px var(--danger); }
.btn.big { min-height: 64px; font-size: 1.25rem; font-family: var(--font-display); border-radius: 18px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.stack.tight { gap: 8px; }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.soft { background: var(--kid-soft); box-shadow: none; }
.note { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); color: var(--muted); font-size: .92rem; }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.empty .big-e { font-size: 3rem; }

/* Who's using */
.hello { display: grid; gap: 4px; padding-top: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px 12px 16px; display: grid; justify-items: center; gap: 6px; text-align: center; border-top: 6px solid var(--kid); }
.tile .ava { width: 82px; height: 82px; border-radius: 26px; display: grid; place-items: center; font-size: 3rem; background: var(--kid-soft); }
.tile .nm { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.1; overflow-wrap: anywhere; }
.tile .sub { font-size: .85rem; color: var(--muted); font-weight: 700; }
.grown { justify-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; color: var(--muted); min-height: 48px; }

/* Code pad */
.pad-wrap { display: grid; gap: 18px; justify-items: center; text-align: center; padding-top: 12px; }
.pad-ava { width: 96px; height: 96px; border-radius: 30px; display: grid; place-items: center; font-size: 3.4rem; background: var(--kid-soft); }
.dots { display: flex; gap: 14px; justify-content: center; min-height: 26px; }
.dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--kid); display: grid; place-items: center; font-size: .95rem; }
.dot.on { background: var(--kid); }
.dots.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
.pad { display: grid; gap: 10px; width: 100%; max-width: 360px; }
.pad.nums { grid-template-columns: repeat(3, 1fr); }
.pad.pics { grid-template-columns: repeat(4, 1fr); }
.pad.letters { grid-template-columns: repeat(6, 1fr); max-width: 420px; }
.key { min-height: 64px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; display: grid; place-items: center; }
.pad.letters .key { min-height: 52px; font-size: 1.25rem; border-radius: 14px; }
.pad.pics .key { font-size: 2.1rem; min-height: 70px; }
.key.fn { background: transparent; box-shadow: inset 0 0 0 2px var(--line); font-size: 1.1rem; }
.key:active { transform: scale(.96); }
.pad-msg { min-height: 1.4em; font-weight: 700; color: var(--hard); }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(20, 30, 60, .06); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { max-width: 680px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tab { display: grid; justify-items: center; gap: 0; padding: 8px 2px 8px; font-size: .74rem; font-weight: 700; color: var(--muted); min-height: 60px; }
.tab .ti { font-size: 1.45rem; line-height: 1.2; }
.tab.on { color: var(--ink); }
.tab.on .ti { transform: translateY(-1px); }
.tab.on::after { content: ""; width: 26px; height: 4px; border-radius: 4px; background: var(--kid); margin-top: 3px; }
.tab .badge { position: absolute; }

/* Today */
.greet { display: grid; gap: 10px; }
.progress { height: 14px; border-radius: 999px; background: var(--surface-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.progress > i { display: block; height: 100%; background: var(--kid); border-radius: 999px; transition: width .4s; }
.section { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.sec-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--kid-soft); }
.sec-head .se { font-size: 1.5rem; }
.sec-head h2 { flex: 1; font-size: 1.3rem; }
.sec-head .cnt { font-weight: 700; color: var(--muted); }
.steps { display: grid; }
.step { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-top: 1px solid var(--line); min-height: 76px; }
.step:first-child { border-top: 0; }
.step .main { flex: 1; display: flex; align-items: center; gap: 12px; text-align: left; min-width: 0; padding: 4px 0; }
.pic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 2rem; background: var(--surface-2); flex: none; overflow: hidden; }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.step .txt { display: grid; gap: 2px; min-width: 0; }
.step .lbl { font-family: var(--font-display); font-weight: 700; font-size: 1.18rem; line-height: 1.15; overflow-wrap: anywhere; }
.step .sub { font-size: .86rem; color: var(--muted); }
.time { display: inline-block; padding: 2px 8px; border-radius: 8px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: .8rem; margin-right: 6px; }
.check { width: 52px; height: 52px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--line); display: grid; place-items: center; font-size: 1.6rem; flex: none; color: transparent; }
.step.done .check { background: var(--good); box-shadow: none; color: #fff; }
.step.done .lbl { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.mini { min-height: 40px; padding: 6px 12px; border-radius: 12px; font-weight: 700; font-size: .85rem; background: var(--kid-soft); color: var(--ink); flex: none; }
.say { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 1.25rem; background: var(--surface-2); flex: none; }
.checkin { padding: 14px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.checkin .q { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.faces { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.face { min-height: 70px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 1rem; box-shadow: inset 0 0 0 2px var(--line); }
.face .fe { font-size: 2rem; }
.face.on.good { background: var(--good-soft); box-shadow: inset 0 0 0 3px var(--good); }
.face.on.notyet { background: var(--hard-soft); box-shadow: inset 0 0 0 3px var(--hard); }

/* Little focus card */
.focus { background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); padding: 22px 18px; display: grid; gap: 14px; justify-items: center; text-align: center; border-top: 8px solid var(--kid); }
.focus .fpic { width: 168px; height: 168px; border-radius: 40px; display: grid; place-items: center; font-size: 6.2rem; background: var(--kid-soft); overflow: hidden; }
.focus .fpic img { width: 100%; height: 100%; object-fit: cover; }
.focus .flbl { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; line-height: 1.05; overflow-wrap: anywhere; }
.focus .fstep { font-weight: 700; color: var(--muted); }

/* Star burst */
.burst { position: fixed; z-index: 60; pointer-events: none; font-size: 2.2rem; animation: burst .9s ease-out forwards; }
@keyframes burst { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1 } 60% { opacity: 1 } 100% { transform: translate(-50%, -160%) scale(1.4); opacity: 0 } }

/* Timer */
.timer-card { display: grid; gap: 18px; justify-items: center; text-align: center; }
.dial { --p: 1; --tc: #E5484D; width: min(78vw, 320px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; position: relative; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 10px var(--surface-2); display: grid; place-items: center; }
.dial::before { content: ""; position: absolute; inset: 18px; border-radius: 50%; background: conic-gradient(var(--tc) calc(var(--p) * 1turn), transparent 0); transition: background .2s; }
.dial::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: repeating-conic-gradient(var(--line) 0 1deg, transparent 1deg 30deg); -webkit-mask: radial-gradient(circle, transparent 66%, #000 67%); mask: radial-gradient(circle, transparent 66%, #000 67%); }
.dial .face-in { position: relative; z-index: 1; width: 56%; aspect-ratio: 1; border-radius: 50%; background: var(--surface); display: grid; place-items: center; align-content: center; gap: 0; box-shadow: var(--shadow); }
.dial .tl { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 9vw, 2.9rem); line-height: 1; }
.dial .tlab { font-size: .85rem; color: var(--muted); font-weight: 700; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dial.warn { animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { transform: scale(1.03) } }
.presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pre { min-width: 64px; min-height: 48px; border-radius: 14px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; padding: 0 12px; }
.pre.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.swatches { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.sw { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.6); }
.sw.on { outline: 3px solid var(--ink); outline-offset: 2px; }
.stepper { display: inline-flex; align-items: center; gap: 12px; }
.stepper button { width: 48px; height: 48px; border-radius: 14px; box-shadow: inset 0 0 0 2px var(--line); font-size: 1.4rem; font-weight: 700; }
.stepper output { min-width: 96px; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; text-align: center; }
.timer-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; min-height: 40px; }

/* Overlay + toast */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 24, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(100%, 440px); background: var(--surface); border-radius: 26px; padding: 24px 20px; display: grid; gap: 14px; justify-items: center; text-align: center; box-shadow: var(--shadow); max-height: 100%; overflow: auto; }
.sheet .bige { font-size: 4.4rem; line-height: 1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 55; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 16px; font-weight: 700; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

/* Calm */
.calm-steps { display: flex; gap: 6px; justify-content: center; }
.calm-steps i { width: 34px; height: 6px; border-radius: 6px; background: var(--line); }
.calm-steps i.on { background: var(--kid); }
.bigfaces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bigface { display: grid; justify-items: center; gap: 6px; padding: 14px 6px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; font-size: .92rem; }
.bigface .fe { font-size: 3rem; line-height: 1; }
.bigface.lv-calm { border-bottom: 6px solid var(--good); }
.bigface.lv-wiggly { border-bottom: 6px solid var(--star); }
.bigface.lv-upset { border-bottom: 6px solid var(--danger); }
.feelings { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.feel { min-height: 60px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; padding: 6px; }
.feel .fe { font-size: 1.7rem; }
.feel.on { box-shadow: inset 0 0 0 3px var(--kid); background: var(--kid-soft); }
.breath { width: 210px; height: 210px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.breath::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--kid-soft); box-shadow: inset 0 0 0 4px var(--kid); transform: scale(.55); animation: breathe 8s ease-in-out infinite; }
.breath span { position: relative; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; }
@keyframes breathe { 0%, 100% { transform: scale(.55) } 50% { transform: scale(1) } }
.stopsign { width: 150px; height: 150px; display: grid; place-items: center; background: var(--danger); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 2rem; clip-path: polygon(29% 0, 71% 0, 100% 29%, 100% 71%, 71% 100%, 29% 100%, 0 71%, 0 29%); }

/* Cards grid (moves, calm moves, rewards) */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.mcard { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 6px; justify-items: center; text-align: center; align-content: start; }
.mcard .me { font-size: 2.6rem; line-height: 1.1; }
.mcard .mn { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; line-height: 1.1; }
.mcard .mr { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--kid-soft); font-weight: 700; font-size: .82rem; }
.mcard.done { box-shadow: inset 0 0 0 3px var(--good); }
.mind { padding: 10px 12px; border-radius: 14px; background: var(--surface-2); font-size: .95rem; }
.mind b { color: var(--kid); display: block; font-size: .75rem; letter-spacing: .07em; text-transform: uppercase; }
.count-big { font-family: var(--font-display); font-weight: 800; font-size: 4rem; line-height: 1; }

/* Rewards */
.balance { display: grid; justify-items: center; gap: 2px; padding: 18px; border-radius: 24px; background: var(--star-soft); text-align: center; }
.balance .bn { font-family: var(--font-display); font-weight: 800; font-size: 3.2rem; line-height: 1; }
.rw { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
.rw .re { font-size: 2.2rem; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.rw .rt { flex: 1; min-width: 0; display: grid; gap: 4px; }
.rw .rn { font-weight: 700; font-family: var(--font-display); font-size: 1.12rem; line-height: 1.15; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--star); }

/* Week + month */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

.wd .wf { font-size: 1.1rem; min-height: 1.4em; }
.wbar { width: 70%; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.wbar i { display: block; height: 100%; background: var(--good); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .ch { text-align: center; font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; padding: 4px 0; }
.cal .cd { aspect-ratio: 1; border-radius: 10px; display: grid; align-content: center; justify-items: center; font-size: .78rem; background: var(--surface-2); position: relative; min-width: 0; }

.cal .cd.blank { background: transparent; }

.legend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.stat { padding: 12px; border-radius: 16px; background: var(--surface-2); display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; }

/* Parent */
.segs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.seg { flex: none; min-height: 42px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; }
.seg.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.kidrow { display: flex; align-items: center; gap: 12px; }
.kidrow .ava-m { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; font-size: 2rem; background: var(--kid-soft); flex: none; }
.kidrow .kt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.kidrow .kn { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.list { display: grid; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 56px; }
.li:first-child { border-top: 0; }
.li .le { font-size: 1.6rem; width: 40px; text-align: center; flex: none; }
.li .lt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line); font-size: 1rem; flex: none; }
.field { display: grid; gap: 6px; }
.field > span { font-weight: 700; font-size: .92rem; }
.input { width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); }
textarea.input { min-height: 84px; resize: vertical; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { min-height: 44px; padding: 8px 14px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; text-align: left; }
.choice.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.choice small { display: block; font-weight: 400; opacity: .8; }
.emojis { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; max-height: 220px; overflow-y: auto; padding: 2px; }
.emo { height: 46px; border-radius: 12px; font-size: 1.5rem; display: grid; place-items: center; background: var(--surface-2); }
.emo.on { box-shadow: inset 0 0 0 3px var(--primary); background: var(--surface); }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.day { width: 44px; height: 44px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; font-size: .85rem; }
.day.on { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }

.req { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px; border-radius: 16px; background: var(--star-soft); }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.switch { width: 56px; height: 32px; border-radius: 999px; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch.on { background: var(--good); }
.switch.on::after { left: 28px; }
.daycards { display: grid; gap: 10px; }
.daycard { display: grid; gap: 6px; padding: 12px; border-radius: 16px; background: var(--surface-2); }
.daycard .dh { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; flex-wrap: wrap; }
.daycard .dl { display: flex; gap: 8px; flex-wrap: wrap; font-size: .88rem; }
.banner { padding: 10px 14px; border-radius: 14px; background: var(--hard-soft); color: var(--ink); font-size: .92rem; }

/* Mode tuning */

}

/* Fixes after phone testing */

/* ===== Update 2: clock, timer bubble, easy-read font ===== */
.clock { font-weight: 700; font-size: .92rem; padding: 6px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); white-space: nowrap; flex: none; }
.tbub { position: fixed; z-index: 26; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow), 0 6px 20px rgba(0,0,0,.18); }
.tbub.over-tabs { bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); }
.tbub-ring { position: absolute; inset: 5px; border-radius: 50%; background: conic-gradient(var(--tc) calc(var(--p) * 1turn), var(--surface-2) 0); -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%); mask: radial-gradient(circle, transparent 60%, #000 61%); }
.tbub-t { position: relative; font-family: var(--font-display); font-weight: 800; font-size: .98rem; }
.font-easy { --font-body: "Lexend", "Atkinson Hyperlegible", system-ui, sans-serif; --font-display: "Lexend", "Atkinson Hyperlegible", system-ui, sans-serif; letter-spacing: .035em; word-spacing: .14em; }

/* Celebration */

@keyframes fall { 0% { transform: translateY(-20px) rotate(0) } 100% { transform: translateY(110vh) rotate(540deg) } }

/* Devotional */

.lvl-big { display: flex; align-items: center; gap: 14px; }

/* Reports */
.fbars { display: grid; gap: 8px; }
.fbar { display: grid; grid-template-columns: minmax(0, 9.5em) 1fr 2.2em; gap: 10px; align-items: center; }
.fbar .fl { font-weight: 700; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Play: pet and world ===== */
.tab { font-size: .7rem; padding: 8px 0; }

  }

}

const PARTS = ['morning', 'afternoon', 'evening'];
function partOf(s) {

  const n = s.n || '';

  if (/bed|night|evening|calm.?down|dinner/i.test(n)) return 'evening';

setInterval(() => {
  const G = UI.guide; if (!G || !G.running || UI.view !== 'child' || UI.tab !== 'calm') return;
  const t = toolInfo(G.id), el = Date.now() - G.t0, k = kidById(UI.childId);
  const set = (id, v) => { const n = $(id); if (n && n.textContent !== String(v)) n.textContent = v; };
  const finish = () => { G.running = false; G.finished = true; play('star'); buzz(40); render(); };
  if (t.g === 'breathe' || t.g === 'flower') {
    const i = Math.floor(el / 8000), inPh = el % 8000 < 4000;
    if (i >= t.count) return finish();
    set('#gtxt', inPh ? (t.g === 'flower' ? 'Smell the flower…' : 'Breathe in…') : (t.g === 'flower' ? 'Blow out the candle…' : 'Breathe out…'));
    set('#gnum', `${i + 1} of ${t.count}`); if (t.g === 'flower') set('#gico', inPh ? '🌸' : '🕯️');
  } else if (t.g === 'countdown' || t.g === 'countup') {

    if (end) return finish();

  } else if (t.g === 'timed') {
    const per = t.secs + (t.rest ? 3 : 0), s = el / 1000, r = Math.floor(s / per);
    if (r >= t.reps) return finish();
    const w = s - r * per;
    set('#grep', t.reps > 1 ? `${r + 1} of ${t.reps}` : '');

{
